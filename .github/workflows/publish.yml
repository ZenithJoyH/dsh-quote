name: publish

# Publishing is paused on purpose: the desktop profile installs this plugin from
# source (link:), so a registry release is not needed. Only a manual
# workflow_dispatch can publish, so a GitHub release never ships to npm by accident.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Show npm version
        run: npm --version
      - name: Smoke test
        run: node test/client.smoke.cjs
      - name: Publish with trusted publishing
        run: npm publish --provenance --access public
